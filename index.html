<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Track your daily habits and checkpoints with Habit Bloom.">
  <title>Habit Bloom - Habit Tracker</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./">Habit Bloom</a>
      <button id="theme-toggle" class="secondary-button" type="button">Dark mode</button>
    </header>

    <main>
      <div class="page-heading">
        <div>
          <h1>My Habit Tracker</h1>
          <p class="lead">Today: <span id="live-date"></span></p>
        </div>
        <button id="add-habit-top" class="primary-button" type="button">+ Add a habit</button>
      </div>

      <section class="overview" aria-label="Today's progress">
        <div class="momentum-card">
          <div>
            <h2 id="momentum-title">Today's progress</h2>
            <p id="momentum-message">Mark a checkpoint to get started.</p>
          </div>
          <div id="progress-ring" class="progress-ring" role="img" aria-label="0 percent of today's checkpoints completed">
            <strong id="progress-percent">0%</strong>
          </div>
        </div>
        <div class="stat-card">
          <span class="stat-label">Completed habits</span>
          <strong id="habits-complete">0 <span>/ 0</span></strong>
        </div>
        <div class="stat-card">
          <span class="stat-label">Checkpoints done</span>
          <strong id="checkpoints-complete">0 <span>/ 0</span></strong>
        </div>
      </section>

      <section class="week-section" aria-labelledby="week-title">
        <div class="section-heading">
          <h2 id="week-title">Last 7 days</h2>
          <p>Click a day to see or update your progress.</p>
        </div>
        <div id="week-strip" class="week-strip" aria-label="Last seven days"></div>
      </section>

      <section class="habits-section" aria-labelledby="habits-title">
        <div class="section-heading habits-heading">
          <h2 id="habits-title">My habits <span id="habit-count" class="habit-count">0</span></h2>
          <div class="habit-toolbar">
            <button id="add-habit-inline" class="secondary-button" type="button">+ Add habit</button>
            <button id="export-button" class="text-button" type="button">Export data</button>
            <button id="import-button" class="text-button" type="button">Import data</button>
            <input id="import-file" type="file" accept="application/json,.json" hidden>
          </div>
        </div>
        <div id="selected-day-banner" class="selected-day-banner" hidden>
          <span id="selected-day-label"></span>
          <button id="return-today" class="text-button" type="button">Back to today</button>
        </div>
        <div id="habits-grid" class="habits-grid"></div>
      </section>
    </main>

    <footer class="footer">Your habits are saved in this browser.</footer>
  </div>

  <dialog id="habit-dialog" class="habit-dialog" aria-labelledby="dialog-title">
    <form id="habit-form" novalidate>
      <div class="dialog-head">
        <h2 id="dialog-title">New habit</h2>
        <button id="close-dialog" class="close-button" type="button" aria-label="Close dialog">×</button>
      </div>

      <label for="habit-name">Habit name *</label>
      <input id="habit-name" name="name" type="text" maxlength="48" placeholder="For example: Read a book" required>

      <label for="habit-note">Note (optional)</label>
      <input id="habit-note" name="note" type="text" maxlength="100" placeholder="A short reminder">

      <div class="form-row">
        <div>
          <label for="habit-target">Checkpoints each day *</label>
          <input id="habit-target" name="target" type="number" min="1" max="12" value="3" required>
        </div>
        <div>
          <label for="habit-unit">What is one checkpoint?</label>
          <input id="habit-unit" name="unit" type="text" maxlength="24" placeholder="For example: 10 minutes">
        </div>
      </div>

      <div class="form-row">
        <div>
          <label for="habit-icon">Symbol</label>
          <input id="habit-icon" name="icon" type="text" maxlength="8" value="✓" aria-describedby="icon-hint">
          <small id="icon-hint">An emoji or a short symbol</small>
        </div>
        <div>
          <label for="habit-color">Color</label>
          <select id="habit-color" name="color">
            <option value="blue">Blue</option>
            <option value="green">Green</option>
            <option value="coral">Orange</option>
            <option value="violet">Purple</option>
            <option value="amber">Yellow</option>
          </select>
        </div>
      </div>

      <p id="form-error" class="form-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button id="cancel-dialog" class="secondary-button" type="button">Cancel</button>
        <button id="save-habit" class="primary-button" type="submit">Create habit</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
